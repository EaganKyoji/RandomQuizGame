name: Repository CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate Specification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Required Files
        run: |
          test -s Specification/design.md
          test -s Specification/specs.md
          test -s Specification/tasks.md